table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step
    using:
      foreign_key_constraint_on: step_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - created_at
      filter:
        workflow_run:
          workflow:
            org_id:
              _in:
                - _val: "SELECT org_id FROM public.org_members WHERE user_id = X-Hasura-User-Id"
