table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
      filter:
        org_id:
          _in:
            - _val: "SELECT org_id FROM public.org_members WHERE user_id = X-Hasura-User-Id"
insert_permissions:
  - role: owner
    permission:
      check:
        org_id:
          _in:
            - _val: "SELECT org_id FROM public.org_members WHERE user_id = X-Hasura-User-Id AND role = 'owner'"
      columns:
        - user_id
        - org_id
        - role
update_permissions:
  - role: owner
    permission:
      filter:
        org_id:
          _in:
            - _val: "SELECT org_id FROM public.org_members WHERE user_id = X-Hasura-User-Id AND role = 'owner'"
      columns:
        - role
delete_permissions:
  - role: owner
    permission:
      filter:
        org_id:
          _in:
            - _val: "SELECT org_id FROM public.org_members WHERE user_id = X-Hasura-User-Id AND role = 'owner'"
