table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - status
        - started_at
        - completed_at
        - trigger_type
        - created_by
        - created_at
      filter:
        workflow:
          org_id:
            _in:
              - _val: "SELECT org_id FROM public.org_members WHERE user_id = X-Hasura-User-Id"
insert_permissions:
  - role: editor
    permission:
      check:
        workflow:
          org_id:
            _in:
              - _val: "SELECT org_id FROM public.org_members WHERE user_id = X-Hasura-User-Id AND role IN ('editor', 'owner')"
      columns:
        - workflow_id
        - status
        - trigger_type
        - created_by
  - role: owner
    permission:
      check:
        workflow:
          org_id:
            _in:
              - _val: "SELECT org_id FROM public.org_members WHERE user_id = X-Hasura-User-Id AND role = 'owner'"
      columns:
        - workflow_id
        - status
        - trigger_type
        - created_by
