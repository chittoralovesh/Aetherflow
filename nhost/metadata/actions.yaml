- name: triggerWorkflowRun
  definition:
    kind: synchronous
    handler: "{{FUNCTIONS_URL}}/trigger"
    forward_client_headers: true
  permissions:
    - role: user
- name: approveStep
  definition:
    kind: synchronous
    handler: "{{FUNCTIONS_URL}}/approve"
    forward_client_headers: true
  permissions:
    - role: user
custom_types:
  input_objects: []
  objects:
    - name: TriggerWorkflowOutput
      fields:
        - name: runId
          type: String!
        - name: status
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: status
          type: String!
  scalars: []
